AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudWatch Alarms for SQS - Service Impact & Processing Failures (5XX equivalent)'

Parameters:
  QueueName:
    Type: String
    Description: Name of the SQS queue
  AlarmThreshold:
    Type: Number
    Description: Threshold for dead letter queue messages
    Default: 50
  EvaluationPeriods:
    Type: Number
    Description: Number of periods to evaluate
    Default: 2
  SnsTopicArn:
    Type: String
    Description: SNS Topic ARN for notifications

Resources:
  SQSDeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'SQS-${QueueName}-DLQ-Processing-Failures'
      AlarmDescription: CRITICAL - Messages in DLQ indicate service processing failures (5XX equivalent)
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Statistic: Average
      Period: 300
      EvaluationPeriods: !Ref EvaluationPeriods
      Threshold: !Ref AlarmThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: QueueName
          Value: !Sub '${QueueName}-dlq'
      AlarmActions:
        - !Ref SnsTopicArn
      TreatMissingData: notBreaching
      Tags:
        - Key: Service
          Value: SQS
        - Key: AlertType
          Value: Processing-Failure
        - Key: Severity
          Value: Critical

  SQSQueueDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'SQS-${QueueName}-Consumer-Failure-Backlog'
      AlarmDescription: HIGH - Queue backlog indicates consumer service failures or degradation
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 1000
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: QueueName
          Value: !Ref QueueName
      AlarmActions:
        - !Ref SnsTopicArn
      TreatMissingData: notBreaching
      Tags:
        - Key: Service
          Value: SQS
        - Key: AlertType
          Value: Consumer-Failure
        - Key: Severity
          Value: High

  SQSOldestMessageAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'SQS-${QueueName}-Processing-Stalled'
      AlarmDescription: HIGH - Messages not processing indicates service outage or severe degradation
      MetricName: ApproximateAgeOfOldestMessage
      Namespace: AWS/SQS
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1800
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: QueueName
          Value: !Ref QueueName
      AlarmActions:
        - !Ref SnsTopicArn
      TreatMissingData: notBreaching
      Tags:
        - Key: Service
          Value: SQS
        - Key: AlertType
          Value: Service-Stalled
        - Key: Severity
          Value: High

  SQSConsumerFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'SQS-${QueueName}-Consumer-Service-Down'
      AlarmDescription: CRITICAL - Consumer service stopped receiving messages (service outage)
      MetricName: NumberOfMessagesReceived
      Namespace: AWS/SQS
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      Dimensions:
        - Name: QueueName
          Value: !Ref QueueName
      AlarmActions:
        - !Ref SnsTopicArn
      TreatMissingData: breaching
      Tags:
        - Key: Service
          Value: SQS
        - Key: AlertType
          Value: Consumer-Outage
        - Key: Severity
          Value: Critical

Outputs:
  DLQProcessingFailuresAlarmName:
    Description: Name of the DLQ processing failures alarm (5XX equivalent)
    Value: !Ref SQSDeadLetterQueueAlarm

  ConsumerFailureBacklogAlarmName:
    Description: Name of the consumer failure backlog alarm
    Value: !Ref SQSQueueDepthAlarm

  ProcessingStalledAlarmName:
    Description: Name of the processing stalled alarm
    Value: !Ref SQSOldestMessageAgeAlarm

  ConsumerServiceDownAlarmName:
    Description: Name of the consumer service down alarm
    Value: !Ref SQSConsumerFailureAlarm
