AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudWatch Alarms for ALB - Critical 5XX Service Failures'

Parameters:
  LoadBalancerName:
    Type: String
    Description: Name of the Application Load Balancer
  LoadBalancerArn:
    Type: String
    Description: ARN of the Application Load Balancer
  AlarmThreshold:
    Type: Number
    Description: Threshold for number of 5XX errors
    Default: 10
  EvaluationPeriods:
    Type: Number
    Description: Number of periods to evaluate
    Default: 1
  SnsTopicArn:
    Type: String
    Description: SNS Topic ARN for notifications

Resources:
  ALBTarget5XXErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ALB-${LoadBalancerName}-Target-5XX-Critical'
      AlarmDescription: CRITICAL - Backend targets returning 5XX errors (application/service failures)
      MetricName: HTTPCode_Target_5XX_Count
      Namespace: AWS/ApplicationELB
      Statistic: Sum
      Period: 60
      EvaluationPeriods: !Ref EvaluationPeriods
      Threshold: !Ref AlarmThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: LoadBalancer
          Value: !Select [1, !Split [':', !Ref LoadBalancerArn]]
      AlarmActions:
        - !Ref SnsTopicArn
      TreatMissingData: notBreaching
      Tags:
        - Key: Service
          Value: ALB
        - Key: AlertType
          Value: Target-5XX
        - Key: Severity
          Value: Critical

  ALBElastic5XXErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ALB-${LoadBalancerName}-ELB-5XX-Critical'
      AlarmDescription: CRITICAL - ALB itself returning 5XX errors (load balancer infrastructure issues)
      MetricName: HTTPCode_ELB_5XX_Count
      Namespace: AWS/ApplicationELB
      Statistic: Sum
      Period: 60
      EvaluationPeriods: !Ref EvaluationPeriods
      Threshold: !Ref AlarmThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: LoadBalancer
          Value: !Select [1, !Split [':', !Ref LoadBalancerArn]]
      AlarmActions:
        - !Ref SnsTopicArn
      TreatMissingData: notBreaching
      Tags:
        - Key: Service
          Value: ALB
        - Key: AlertType
          Value: ELB-5XX
        - Key: Severity
          Value: Critical

  ALBUnHealthyHostsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ALB-${LoadBalancerName}-No-Healthy-Targets'
      AlarmDescription: CRITICAL - No healthy targets available (causes 5XX responses to clients)
      MetricName: UnHealthyHostCount
      Namespace: AWS/ApplicationELB
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: LoadBalancer
          Value: !Select [1, !Split [':', !Ref LoadBalancerArn]]
      AlarmActions:
        - !Ref SnsTopicArn
      TreatMissingData: notBreaching
      Tags:
        - Key: Service
          Value: ALB
        - Key: AlertType
          Value: No-Healthy-Targets
        - Key: Severity
          Value: Critical

Outputs:
  Target5XXAlarmName:
    Description: Name of the Target 5XX errors alarm (backend failures)
    Value: !Ref ALBTarget5XXErrorsAlarm

  ELB5XXAlarmName:
    Description: Name of the ELB 5XX errors alarm (ALB infrastructure failures)
    Value: !Ref ALBElastic5XXErrorsAlarm

  NoHealthyTargetsAlarmName:
    Description: Name of the no healthy targets alarm (causes 5XX)
    Value: !Ref ALBUnHealthyHostsAlarm
