AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudWatch Alarms for DynamoDB - Critical Service Failures (5XX equivalent)'

Parameters:
  TableName:
    Type: String
    Description: Name of the DynamoDB table
  AlarmThreshold:
    Type: Number
    Description: Threshold for system errors
    Default: 100
  EvaluationPeriods:
    Type: Number
    Description: Number of periods to evaluate
    Default: 2
  SnsTopicArn:
    Type: String
    Description: SNS Topic ARN for notifications

Resources:
  DynamoDBSystemErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'DynamoDB-${TableName}-System-Errors-Critical'
      AlarmDescription: CRITICAL - DynamoDB system errors indicate service-side failures (5XX equivalent)
      MetricName: SystemErrors
      Namespace: AWS/DynamoDB
      Statistic: Sum
      Period: 60
      EvaluationPeriods: !Ref EvaluationPeriods
      Threshold: !Ref AlarmThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: TableName
          Value: !Ref TableName
      AlarmActions:
        - !Ref SnsTopicArn
      TreatMissingData: notBreaching
      Tags:
        - Key: Service
          Value: DynamoDB
        - Key: AlertType
          Value: System-Errors
        - Key: Severity
          Value: Critical

  DynamoDBReadThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'DynamoDB-${TableName}-Read-Throttling-Critical'
      AlarmDescription: CRITICAL - Read requests throttled, service capacity exceeded causing failures
      MetricName: ReadThrottleEvents
      Namespace: AWS/DynamoDB
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: TableName
          Value: !Ref TableName
      AlarmActions:
        - !Ref SnsTopicArn
      TreatMissingData: notBreaching
      Tags:
        - Key: Service
          Value: DynamoDB
        - Key: AlertType
          Value: Read-Throttling
        - Key: Severity
          Value: Critical

  DynamoDBWriteThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'DynamoDB-${TableName}-Write-Throttling-Critical'
      AlarmDescription: CRITICAL - Write requests throttled, service capacity exceeded causing failures
      MetricName: WriteThrottleEvents
      Namespace: AWS/DynamoDB
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: TableName
          Value: !Ref TableName
      AlarmActions:
        - !Ref SnsTopicArn
      TreatMissingData: notBreaching
      Tags:
        - Key: Service
          Value: DynamoDB
        - Key: AlertType
          Value: Write-Throttling
        - Key: Severity
          Value: Critical

  DynamoDBConditionalCheckFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'DynamoDB-${TableName}-Transaction-Failures-High'
      AlarmDescription: HIGH - Conditional check failures spiking may indicate data consistency issues
      MetricName: ConditionalCheckFailedRequests
      Namespace: AWS/DynamoDB
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 100
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: TableName
          Value: !Ref TableName
      AlarmActions:
        - !Ref SnsTopicArn
      TreatMissingData: notBreaching
      Tags:
        - Key: Service
          Value: DynamoDB
        - Key: AlertType
          Value: Transaction-Failures
        - Key: Severity
          Value: High

Outputs:
  SystemErrorsAlarmName:
    Description: Name of the system errors alarm (5XX equivalent)
    Value: !Ref DynamoDBSystemErrorsAlarm

  ReadThrottleAlarmName:
    Description: Name of the read throttling alarm
    Value: !Ref DynamoDBReadThrottleAlarm

  WriteThrottleAlarmName:
    Description: Name of the write throttling alarm
    Value: !Ref DynamoDBWriteThrottleAlarm

  TransactionFailuresAlarmName:
    Description: Name of the transaction failures alarm
    Value: !Ref DynamoDBConditionalCheckFailuresAlarm
