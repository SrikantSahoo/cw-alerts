AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudWatch Alarms for ECS - Critical Service Failures (5XX equivalent)'

Parameters:
  ClusterName:
    Type: String
    Description: Name of the ECS cluster
  ServiceName:
    Type: String
    Description: Name of the ECS service
  AlarmThreshold:
    Type: Number
    Description: Threshold for 5XX errors
    Default: 5
  EvaluationPeriods:
    Type: Number
    Description: Number of periods to evaluate
    Default: 1
  SnsTopicArn:
    Type: String
    Description: SNS Topic ARN for notifications

Resources:
  ECSServiceDownAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ECS-${ClusterName}-${ServiceName}-Service-Down'
      AlarmDescription: CRITICAL - ECS service has no running tasks (complete service outage)
      MetricName: RunningCount
      Namespace: ECS/ContainerInsights
      Statistic: Average
      Period: 60
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      Dimensions:
        - Name: ClusterName
          Value: !Ref ClusterName
        - Name: ServiceName
          Value: !Ref ServiceName
      AlarmActions:
        - !Ref SnsTopicArn
      TreatMissingData: breaching
      Tags:
        - Key: Service
          Value: ECS
        - Key: AlertType
          Value: Service-Outage
        - Key: Severity
          Value: Critical

  ECSTaskFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ECS-${ClusterName}-${ServiceName}-Task-Crash-Loop'
      AlarmDescription: HIGH - Tasks repeatedly failing indicates application crashes or misconfigurations
      MetricName: RunningCount
      Namespace: ECS/ContainerInsights
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 0.5
      ComparisonOperator: LessThanThreshold
      Dimensions:
        - Name: ClusterName
          Value: !Ref ClusterName
        - Name: ServiceName
          Value: !Ref ServiceName
      AlarmActions:
        - !Ref SnsTopicArn
      TreatMissingData: notBreaching
      Tags:
        - Key: Service
          Value: ECS
        - Key: AlertType
          Value: Task-Crash-Loop
        - Key: Severity
          Value: High

  ECSApplicationErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ECS-${ClusterName}-${ServiceName}-Application-Errors'
      AlarmDescription: CRITICAL - Application errors in container logs indicate service failures (5XX equivalent)
      MetricName: Errors
      Namespace: Custom/ECS
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref AlarmThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: ClusterName
          Value: !Ref ClusterName
        - Name: ServiceName
          Value: !Ref ServiceName
      AlarmActions:
        - !Ref SnsTopicArn
      TreatMissingData: notBreaching
      Tags:
        - Key: Service
          Value: ECS
        - Key: AlertType
          Value: Application-Errors
        - Key: Severity
          Value: Critical

Outputs:
  ServiceDownAlarmName:
    Description: Name of the service down alarm (complete outage)
    Value: !Ref ECSServiceDownAlarm

  TaskCrashLoopAlarmName:
    Description: Name of the task crash loop alarm
    Value: !Ref ECSTaskFailuresAlarm

  ApplicationErrorsAlarmName:
    Description: Name of the application errors alarm (5XX equivalent)
    Value: !Ref ECSApplicationErrorsAlarm

  TaskCountAlarmName:
    Description: Name of the task count alarm
    Value: !Ref ECSTaskCountAlarm
