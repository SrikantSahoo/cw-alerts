AWSTemplateFormatVersion: '2010-09-09'
Description: Add EventBridge permissions to existing AWS_Deploy_Role

Resources:
  EventBridgeInlinePolicy:
    Type: AWS::IAM::RolePolicy
    Properties:
      RoleName: AWS_Deploy_Role
      PolicyName: EventBridge-Deploy-Permissions
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EventBusPermissions
            Effect: Allow
            Action:
              - events:CreateEventBus
              - events:DeleteEventBus
              - events:DescribeEventBus
              - events:ListEventBuses
              - events:TagResource
              - events:UntagResource
              - events:ListTagsForResource
            Resource:
              - !Sub 'arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/*'

          - Sid: EventRulePermissions
            Effect: Allow
            Action:
              - events:PutRule
              - events:DeleteRule
              - events:DescribeRule
              - events:EnableRule
              - events:DisableRule
              - events:ListRules
              - events:PutTargets
              - events:RemoveTargets
              - events:ListTargetsByRule
              - events:TagResource
              - events:UntagResource
              - events:ListTagsForResource
            Resource:
              - !Sub 'arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/*'
              - !Sub 'arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/*/*'

          - Sid: EventBridgePipesPermissions
            Effect: Allow
            Action:
              - pipes:CreatePipe
              - pipes:UpdatePipe
              - pipes:DeletePipe
              - pipes:DescribePipe
              - pipes:ListPipes
              - pipes:StartPipe
              - pipes:StopPipe
              - pipes:TagResource
              - pipes:UntagResource
              - pipes:ListTagsForResource
            Resource:
              - !Sub 'arn:aws:pipes:${AWS::Region}:${AWS::AccountId}:pipe/*'

          - Sid: PassRoleForPipes
            Effect: Allow
            Action:
              - iam:PassRole
            Resource: '*'
            Condition:
              StringEquals:
                iam:PassedToService: pipes.amazonaws.com