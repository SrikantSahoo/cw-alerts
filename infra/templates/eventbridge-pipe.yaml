AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Production-ready EventBridge Pipe:
  Source  → DynamoDB Stream (existing table)
  Filter  → EventBridge Pipe source filter
  Target  → NEW EventBridge Custom Event Bus (created by this stack)
  Rule    → Routes matching events to an existing SQS queue

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:

  # --- Source (DynamoDB) ---
  DynamoDBTableName:
    Type: String
    Description: Name of the existing DynamoDB table (must have Streams enabled).

  DynamoDBStreamArn:
    Type: String
    Description: ARN of the DynamoDB Stream on the existing table.

  DynamoDBStartingPosition:
    Type: String
    Default: LATEST
    AllowedValues: [TRIM_HORIZON, LATEST]
    Description: Where in the stream to start reading.

  DynamoDBBatchSize:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 1000
    Description: Maximum number of records per batch sent to the pipe.

  DynamoDBMaximumBatchingWindowSeconds:
    Type: Number
    Default: 5
    MinValue: 0
    MaxValue: 300
    Description: >
      How long (seconds) EventBridge Pipes will wait to accumulate records
      before invoking the target (tumbling window). 0 disables batching.

  DynamoDBMaximumRetryAttempts:
    Type: Number
    Default: 3
    MinValue: 0
    MaxValue: 10000
    Description: Maximum number of retry attempts for failed batches (-1 = unlimited).

  DynamoDBBisectOnError:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Split a failing batch in two and retry each half independently
      to isolate the bad record.

  # --- Filter ---
  # Provide a JSON string that is a valid EventBridge event pattern filter.
  # Default passes only INSERT events whose NewImage contains a field
  # "status" equal to "ACTIVE". Adjust or leave as "[]" for no filter.
  SourceFilterPattern:
    Type: String
    Default: >-
      [{"eventName": ["INSERT", "MODIFY"], "dynamodb": {"NewImage": {"status": {"S": ["ACTIVE"]}}}}]
    Description: >
      JSON array of filter patterns applied to the DynamoDB stream records
      BEFORE they reach the event bus. Use [] for no filtering.

  # --- EventBridge Event Bus (NEW – created by this stack) ---
  EventBusName:
    Type: String
    Description: >
      Name for the NEW custom EventBridge Event Bus that will be created
      by this stack. Must be unique within the account/region.
      (Cannot be "default".)

  EventDetailType:
    Type: String
    Default: DynamoDBStreamRecord
    Description: The detail-type value stamped on events sent to the bus.

  EventSource:
    Type: String
    Default: com.mycompany.dynamodb
    Description: The source value stamped on events sent to the bus.

  # --- SQS (target of the Event Bus rule) ---
  TargetSQSQueueArn:
    Type: String
    Description: ARN of the existing SQS queue that will receive matched events.

  TargetSQSQueueUrl:
    Type: String
    Description: >
      URL of the existing SQS queue. Required to attach the resource-based
      policy that allows EventBridge to send messages to it.

  # --- Dead-Letter Queue for the Pipe ---
  PipeDLQArn:
    Type: String
    Default: ""
    Description: >
      (Optional) ARN of an SQS queue to use as the Pipe's Dead-Letter Queue.
      Leave empty to skip DLQ configuration.

  # --- Pipe Logging ---
  PipeLogLevel:
    Type: String
    Default: ERROR
    AllowedValues: [OFF, ERROR, INFO, TRACE]
    Description: >
      Verbosity of EventBridge Pipe execution logs written to CloudWatch.
      OFF   - no logs.
      ERROR - only failed executions (recommended for production).
      INFO  - successful and failed executions.
      TRACE - full event payload at every stage (useful for debugging;
              avoid in production as it may log sensitive data).

  PipeLogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
    Description: Number of days to retain pipe execution logs in CloudWatch.

  PipeLogIncludeExecutionData:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      When true, the full event payload is included in each log entry.
      Only enable for TRACE-level debugging; may expose sensitive data
      and increase log storage costs.

  # --- Tagging ---
  Environment:
    Type: String
    Default: production
    AllowedValues: [development, staging, production]

  Application:
    Type: String
    Default: my-app
    Description: Application name used for tagging and naming resources.

# ---------------------------------------------------------------------------
# Conditions
# ---------------------------------------------------------------------------
Conditions:
  HasPipeDLQ: !Not [!Equals [!Ref PipeDLQArn, ""]]
  PipeLoggingEnabled: !Not [!Equals [!Ref PipeLogLevel, "OFF"]]
  IncludeExecData: !Equals [!Ref PipeLogIncludeExecutionData, "true"]

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  # -------------------------------------------------------------------------
  # IAM Role – EventBridge Pipe execution role
  # -------------------------------------------------------------------------
  PipeExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Application}-${Environment}-pipe-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: pipes.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: DynamoDBStreamRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadDynamoDBStream
                Effect: Allow
                Action:
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:DescribeStream
                  - dynamodb:ListStreams
                Resource: !Ref DynamoDBStreamArn

        - PolicyName: EventBusPublish
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PutEventsOnBus
                Effect: Allow
                Action:
                  - events:PutEvents
                Resource: !GetAtt CustomEventBus.Arn


        - PolicyName: CloudWatchLogsWrite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CreateLogDelivery
                Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:GetLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutLogEvents
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: "*"
        - PolicyName: PipeDLQAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: SendMessageToDLQ
                Effect: Allow
                Action:
                  - sqs:SendMessage
                # Covers both the optional DLQ (if set) and avoids empty resource list
                Resource: !If
                  - HasPipeDLQ
                  - !Ref PipeDLQArn
                  - !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:placeholder-never-used"

      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: !Ref Application
        - Key: ManagedBy
          Value: CloudFormation

  # -------------------------------------------------------------------------
  # IAM Role – EventBridge Rule target role (put messages on SQS)
  # -------------------------------------------------------------------------
  EventRuleTargetRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Application}-${Environment}-event-rule-target-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: SendToSQS
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowSendMessage
                Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !Ref TargetSQSQueueArn
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: !Ref Application
        - Key: ManagedBy
          Value: CloudFormation

  # -------------------------------------------------------------------------
  # Custom EventBridge Event Bus (NEW)
  # -------------------------------------------------------------------------
  CustomEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Ref EventBusName
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: !Ref Application
        - Key: ManagedBy
          Value: CloudFormation

  # Resource-based policy on the new bus – restrict PutEvents to this account
  # only. Expand the Principal block to allow cross-account access if needed.
  CustomEventBusPolicy:
    Type: AWS::Events::EventBusPolicy
    Properties:
      EventBusName: !Ref CustomEventBus
      StatementId: AllowAccountPutEvents
      Action: events:PutEvents
      Principal: !Ref AWS::AccountId

  # -------------------------------------------------------------------------
  # SQS Queue Policy – allow EventBridge rule to send messages
  # -------------------------------------------------------------------------
  # NOTE: This policy is ADDITIVE. If the queue already has a resource policy,
  # CloudFormation will REPLACE it with this one. Remove this resource and
  # manage the queue policy outside this stack if that would be a problem.
  SQSQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    DependsOn: EventBusToSQSRule
    Properties:
      Queues:
        - !Ref TargetSQSQueueUrl
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgeRuleSendMessage
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !Ref TargetSQSQueueArn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt EventBusToSQSRule.Arn

  # -------------------------------------------------------------------------
  # CloudWatch Log Group – EventBridge Pipe execution logs
  # -------------------------------------------------------------------------
  PipeLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: PipeLoggingEnabled
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/pipes/${Application}-${Environment}-dynamodb-to-eventbus-pipe"
      RetentionInDays: !Ref PipeLogRetentionDays
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: !Ref Application
        - Key: ManagedBy
          Value: CloudFormation

  # -------------------------------------------------------------------------
  # EventBridge Pipe
  # -------------------------------------------------------------------------
  DynamoDBToEventBusPipe:
    Type: AWS::Pipes::Pipe
    Properties:
      Name: !Sub "${Application}-${Environment}-dynamodb-to-eventbus-pipe"
      Description: !Sub >-
        Reads DynamoDB stream for ${DynamoDBTableName}, filters records,
        and publishes to the new ${EventBusName} custom event bus.
      RoleArn: !GetAtt PipeExecutionRole.Arn
      DesiredState: RUNNING

      # --- Source ---
      Source: !Ref DynamoDBStreamArn
      SourceParameters:
        DynamoDBStreamParameters:
          StartingPosition: !Ref DynamoDBStartingPosition
          BatchSize: !Ref DynamoDBBatchSize
          MaximumBatchingWindowInSeconds: !Ref DynamoDBMaximumBatchingWindowSeconds
          MaximumRetryAttempts: !Ref DynamoDBMaximumRetryAttempts
          BisectBatchOnFunctionError: !Ref DynamoDBBisectOnError
          OnPartialBatchItemFailure: AUTOMATIC_BISECT
          DeadLetterConfig: !If
            - HasPipeDLQ
            - Arn: !Ref PipeDLQArn
            - !Ref AWS::NoValue

        # Pipe-level filter – applied before enrichment/target
        FilterCriteria:
          Filters:
            - Pattern: !Select [0, !Split ["|||", !Join ["|||", !Split ["[", !Join ["", !Split ["]", !Ref SourceFilterPattern]]]]]]
          # NOTE: The filter pattern above is a workaround for CloudFormation's
          # inability to pass raw JSON inside a string parameter directly.
          # Prefer using the FilterCriteriaOverride approach below, or deploy
          # via CDK/SAM where you can reference the JSON natively.
          #
          # RECOMMENDED: Replace the Filters block with a direct JSON value
          # if deploying via CDK, SAM, or after converting the parameter to
          # AWS::SSM::Parameter and resolving it at deploy time.

      # --- No enrichment (Lambda/Step Functions) – add here if needed ---
      # Enrichment: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:my-enrichment-fn"

      # --- Target: New Custom Event Bus ---
      Target: !GetAtt CustomEventBus.Arn
      TargetParameters:
        EventBridgeEventBusParameters:
          DetailType: !Ref EventDetailType
          Source: !Ref EventSource
          # EndpointId: ""   # Uncomment for global endpoints

      # --- Log Configuration ---
      LogConfiguration: !If
        - PipeLoggingEnabled
        - Level: !Ref PipeLogLevel
          IncludeExecutionData: !If
            - IncludeExecData
            - - ALL
            - !Ref AWS::NoValue
          CloudwatchLogsLogDestination:
            LogGroupArn: !GetAtt PipeLogGroup.Arn
        - !Ref AWS::NoValue

      Tags:
        Environment: !Ref Environment
        Application: !Ref Application
        ManagedBy: CloudFormation

  # -------------------------------------------------------------------------
  # EventBridge Rule – routes events from the bus to SQS
  # -------------------------------------------------------------------------
  EventBusToSQSRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${Application}-${Environment}-dynamodb-events-to-sqs"
      Description: !Sub >-
        Routes ${EventDetailType} events from the new ${EventBusName} bus
        to the target SQS queue.
      EventBusName: !Ref CustomEventBus
      State: ENABLED

      # Match events published by the pipe above
      EventPattern:
        source:
          - !Ref EventSource
        detail-type:
          - !Ref EventDetailType

      Targets:
        - Id: TargetSQSQueue
          Arn: !Ref TargetSQSQueueArn
          RoleArn: !GetAtt EventRuleTargetRole.Arn
          # Pass the full event to SQS (default).
          # Uncomment InputTransformer below to reshape the payload.
          # InputTransformer:
          #   InputPathsMap:
          #     eventName: "$.detail.eventName"
          #     newImage: "$.detail.dynamodb.NewImage"
          #   InputTemplate: >-
          #     {
          #       "eventName": "<eventName>",
          #       "payload": <newImage>
          #     }

          # Retry policy for the rule target
          RetryPolicy:
            MaximumRetryAttempts: 3
            MaximumEventAgeInSeconds: 3600

          # Dead-letter queue for the rule target (reuse pipe DLQ or a separate one)
          DeadLetterConfig: !If
            - HasPipeDLQ
            - Arn: !Ref PipeDLQArn
            - !Ref AWS::NoValue

  # -------------------------------------------------------------------------
  # CloudWatch Alarm – Pipe execution failures
  # -------------------------------------------------------------------------
  PipeExecutionFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Application}-${Environment}-pipe-execution-failures"
      AlarmDescription: >
        Triggers when the EventBridge Pipe fails to process DynamoDB stream
        records. Investigate CloudWatch Logs and the DLQ.
      Namespace: AWS/EventBridgePipes
      MetricName: ExecutionsFailed
      Dimensions:
        - Name: PipeName
          Value: !Ref DynamoDBToEventBusPipe
      Statistic: Sum
      Period: 300          # 5-minute window
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # -------------------------------------------------------------------------
  # CloudWatch Alarm – EventBridge Rule failed invocations
  # -------------------------------------------------------------------------
  RuleFailedInvocationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${Application}-${Environment}-rule-failed-invocations"
      AlarmDescription: >
        Triggers when the EventBridge Rule fails to deliver events to SQS.
      Namespace: AWS/Events
      MetricName: FailedInvocations
      Dimensions:
        - Name: RuleName
          Value: !Ref EventBusToSQSRule
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching


  # -------------------------------------------------------------------------
  # CloudWatch Metric Filter + Alarm – Pipe log-level ERRORs
  # -------------------------------------------------------------------------
  PipeLogErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Condition: PipeLoggingEnabled
    Properties:
      LogGroupName: !Ref PipeLogGroup
      FilterPattern: '{ $.level = "ERROR" }'
      MetricTransformations:
        - MetricNamespace: !Sub "${Application}/${Environment}/Pipes"
          MetricName: PipeLogErrors
          MetricValue: "1"
          DefaultValue: 0
          Unit: Count

  PipeLogErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: PipeLoggingEnabled
    Properties:
      AlarmName: !Sub "${Application}-${Environment}-pipe-log-errors"
      AlarmDescription: >
        Triggers when ERROR-level entries appear in the pipe's CloudWatch
        log group. Indicates processing failures worth investigating.
      Namespace: !Sub "${Application}/${Environment}/Pipes"
      MetricName: PipeLogErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:

  EventBusName:
    Description: Name of the newly created custom EventBridge Event Bus
    Value: !Ref CustomEventBus
    Export:
      Name: !Sub "${Application}-${Environment}-EventBusName"

  EventBusArn:
    Description: ARN of the newly created custom EventBridge Event Bus
    Value: !GetAtt CustomEventBus.Arn
    Export:
      Name: !Sub "${Application}-${Environment}-EventBusArn"


  PipeLogGroupName:
    Description: CloudWatch Log Group name for pipe execution logs
    Condition: PipeLoggingEnabled
    Value: !Ref PipeLogGroup
    Export:
      Name: !Sub "${Application}-${Environment}-PipeLogGroupName"

  PipeLogGroupArn:
    Description: CloudWatch Log Group ARN for pipe execution logs
    Condition: PipeLoggingEnabled
    Value: !GetAtt PipeLogGroup.Arn
    Export:
      Name: !Sub "${Application}-${Environment}-PipeLogGroupArn"

  PipeName:
    Description: Name of the EventBridge Pipe
    Value: !Ref DynamoDBToEventBusPipe
    Export:
      Name: !Sub "${Application}-${Environment}-PipeName"

  PipeArn:
    Description: ARN of the EventBridge Pipe
    Value: !GetAtt DynamoDBToEventBusPipe.Arn
    Export:
      Name: !Sub "${Application}-${Environment}-PipeArn"

  PipeExecutionRoleArn:
    Description: ARN of the Pipe execution IAM role
    Value: !GetAtt PipeExecutionRole.Arn
    Export:
      Name: !Sub "${Application}-${Environment}-PipeExecutionRoleArn"

  EventRuleArn:
    Description: ARN of the EventBridge Rule routing events to SQS
    Value: !GetAtt EventBusToSQSRule.Arn
    Export:
      Name: !Sub "${Application}-${Environment}-EventRuleArn"

  PipeExecutionFailureAlarmArn:
    Description: ARN of the CloudWatch alarm for pipe execution failures
    Value: !GetAtt PipeExecutionFailureAlarm.Arn

  RuleFailedInvocationsAlarmArn:
    Description: ARN of the CloudWatch alarm for rule failed invocations
    Value: !GetAtt RuleFailedInvocationsAlarm.Arn